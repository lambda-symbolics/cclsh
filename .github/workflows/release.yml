name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  checks: write
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: DeterminateSystems/nix-installer-action@main
      - name: Verify release metadata
        run: nix flake check --no-build
      - name: Build and verify release archive
        run: |
          set -euo pipefail
          version=${GITHUB_REF_NAME#v}
          test "$GITHUB_REF_NAME" = "v$version"
          grep -Eq "^[[:space:]]*:version \"$version\"$" cclsh.asd
          grep -Fx "(defparameter *cclsh-version* \"$version\"" source/main.lisp

          if ! nix build .#release-artifact --out-link result \
              --print-build-logs 2>&1 | tee release-build.log
          then
            {
              echo '## Release build failed'
              echo
              echo '```text'
              tail -n 200 release-build.log
              echo '```'
            } >>"$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          archive_name="cclsh-$version-linux-x86_64.tar.xz"
          test -f "result/$archive_name"
          mkdir dist
          cp "result/$archive_name" "dist/$archive_name"
          (
            cd dist
            sha256sum "$archive_name" >"$archive_name.sha256"
          )
          scripts/verify-release-artifact "dist/$archive_name"
      - name: Publish failed build log
        if: failure()
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const log = fs.existsSync('release-build.log')
              ? fs.readFileSync('release-build.log', 'utf8')
                  .trimEnd().split('\n').slice(-200).join('\n')
              : 'The release build did not start.';
            const jobs = await github.rest.actions.listJobsForWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId
            });
            const job = jobs.data.jobs.find(
              ({name}) => name === process.env.GITHUB_JOB);
            if (!job) {
              core.setFailed('could not find the current release job');
              return;
            }
            await github.rest.checks.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              check_run_id: job.id,
              output: {
                title: 'Release build failed',
                summary: `\`\`\`text\n${log}\n\`\`\``
              }
            });
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${GITHUB_REF_NAME#v}
          if gh release view "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1
          then
            gh release upload "$GITHUB_REF_NAME" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --generate-notes \
              --title "cclsh $version"
          fi
