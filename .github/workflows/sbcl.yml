name: SBCL source launcher

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  checks: write
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Install SBCL and Quicklisp
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes sbcl curl
          curl --fail --location --output quicklisp.lisp \
            https://beta.quicklisp.org/quicklisp.lisp
          sbcl --noinform --non-interactive \
            --load quicklisp.lisp \
            --eval '(quicklisp-quickstart:install)' \
            --eval '(uiop:quit)'
      - name: Fetch locked source dependencies
        run: |
          set -euo pipefail
          for dependency in clinedi structlisp cl-colorist colorlisp colordiff
          do
            git clone "https://github.com/lambda-symbolics/$dependency.git" \
              "../$dependency"
            commit=$(sed -n "s/^$dependency=//p" dependencies.lock)
            git -C "../$dependency" checkout --detach "$commit"
          done
      - name: Exercise the SBCL launcher
        run: |
          set -o pipefail
          make sbcl-check 2>&1 | tee sbcl-check.log
      - name: Publish failed smoke output
        if: failure()
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const output = fs.existsSync('sbcl-check.log')
              ? fs.readFileSync('sbcl-check.log', 'utf8')
                  .trimEnd().split('\n').slice(-200).join('\n')
              : 'The SBCL smoke check did not start.';
            const jobs = await github.rest.actions.listJobsForWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId
            });
            const job = jobs.data.jobs.find(
              ({name}) => name === process.env.GITHUB_JOB);
            if (!job) {
              core.setFailed('could not find the current smoke-check job');
              return;
            }
            await github.rest.checks.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              check_run_id: job.id,
              output: {
                title: 'SBCL smoke check failed',
                summary: `\`\`\`text\n${output}\n\`\`\``
              }
            });
